    <g font-family="Consolas,monospace" font-size="15">
      <text x="28" y="82" fill="#6e849f">12</text><text x="67" y="82" fill="#80caff">function</text><text x="144" y="82" fill="#e7f1ff"> reviewChange</text><text x="273" y="82" fill="#a9bad5">() {</text>
      <rect x="57" y="96" width="372" height="32" rx="5" fill="#244950" opacity=".7"/>
      <text x="28" y="119" fill="#6e849f">13</text><text x="72" y="119" fill="#7be4c1">return</text><text x="130" y="119" fill="#e7f1ff"> discuss(code);</text>
